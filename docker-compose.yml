services:
  api:
    build:
      context: ./
      dockerfile: ./docker/api/Dockerfile
    ports:
      - "8000:80"
      - "5678:5678" # Debug app port
      - "5679:5679" # Debug DAP adapter port
    volumes:
      - ./:/code
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DIALECT: postgresql+psycopg
      DB_USER: omgevingsbeleid
      DB_PASS: omgevingsbeleid
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: omgevingsbeleid
      PYTHONPATH: "/code"
      PUBLICATION_KOOP__PROD__API_KEY: ""
      PUBLICATION_KOOP__PROD__RENVOOI_API_URL: "https://renvooiservice-eto.overheid.nl"
      PUBLICATION_KOOP__PROD__PREVIEW_API_URL: "https://besluitpreviewservice-eto.overheid.nl"
    restart: "no"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

  postgres:
    build:
      context: ./
      dockerfile: ./docker/postgres/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omgevingsbeleid
      POSTGRES_PASSWORD: omgevingsbeleid
      POSTGRES_DB: omgevingsbeleid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omgevingsbeleid -d omgevingsbeleid"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - postgres:/var/lib/postgresql

volumes:
  postgres:
