services:
  api:
    build:
      context: ./
      dockerfile: ./docker/api/Dockerfile
    ports:
      - "8000:80"
      - "5678:5678" # Debug app port
      - "5679:5679" # Debug DAP adapter port
    volumes:
      - ./:/code
    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: ${DB_DRIVER}
      DB_DIALECT: ${DB_DIALECT}
      JWT_SECRET: secret
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      PYTHONPATH: "/code"
      PUBLICATION_KOOP__PROD__API_KEY: ""
      PUBLICATION_KOOP__PROD__RENVOOI_API_URL: "https://renvooiservice-eto.overheid.nl"
      PUBLICATION_KOOP__PROD__PREVIEW_API_URL: "https://besluitpreviewservice-eto.overheid.nl"
    restart: "no"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

  postgres:
    build:
      context: ./
      dockerfile: ./docker/postgres/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./docker/postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - postgres:/var/lib/postgresql

volumes:
  postgres:
