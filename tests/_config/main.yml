model_map: &model_map
  beleidsdoel: beleidsdoel_basic
  beleidskeuze: beleidskeuze_basic
  maatregel: maatregel_basic
  gebiedengroep: gebiedengroep_basic
  gebied: gebied_basic
  gebiedsaanwijzing: gebiedsaanwijzing_basic

api:
  routers:
    - prefix: /users
      endpoints:
        - resolver: create_user
          resolver_data:
            allowed_roles:
              - "Ambtelijk opdrachtgever"
              - "Basic"
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Regisseur Omgevingsbeleid"
    - prefix: /users/{user_uuid}
      endpoints:
        - resolver: get_user
        - resolver: edit_user
          resolver_data:
            allowed_roles:
              - "Ambtelijk opdrachtgever"
              - "Basic"
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Regisseur Omgevingsbeleid"
    - prefix: /storage-files
      endpoints:
        - resolver: list_storage_files
    - prefix: /storage-files/{file_uuid}
      endpoints:
        - resolver: detail_storage_file
    - prefix: /storage-files/{file_uuid}/download
      endpoints:
        - resolver: download_storage_file
    - prefix: /hoofdlijnen
      endpoints:
        - resolver: create_hoofdlijn
        - resolver: list_hoofdlijnen
          resolver_data:
            sort:
              default:
                column: created_date
                order: desc
              allowed_columns:
                - created_date
                - name
                - type
    - prefix: /hoofdlijnen/search
      endpoints:
        - resolver: search_hoofdlijn
          resolver_data:
            sort:
              default:
                column: created_date
                order: desc
              allowed_columns:
                - created_date
                - name
                - type
    - prefix: /hoofdlijnen/{hoofdlijn_uuid}
      endpoints:
        - resolver: delete_hoofdlijn
        - resolver: detail_hoofdlijn
        - resolver: edit_hoofdlijn
    - prefix: /search
      endpoints:
        - resolver: search
          resolver_data:
            search_columns:
              - title
              - description
            model_map: *model_map
            response_model_name: PagedSearchObjectResponse
    - prefix: /modules
      endpoints:
        - resolver: create_module
    - prefix: /modules/{module_id}
      endpoints:
        - resolver: edit_module
        - resolver: activate_module
          resolver_data:
            path: /activate
        - resolver: close_module
          resolver_data:
            path: /close
        - resolver: module_add_existing_object
          resolver_data:
            path: /add-existing-object
            allowed_object_types:
              - beleidsdoel
              - beleidskeuze
              # maatregel is left out on purpose to tests adding invalid objects
    - prefix: /objects/valid
      endpoints:
        - resolver: list_all_latest_objects
          resolver_data:
            allowed_object_types:
              - beleidsdoel
              - beleidskeuze
              - maatregel
              - gebiedengroep
              - gebied
              - gebiedsaanwijzing
            sort:
              default:
                column: title
                order: asc
              allowed_columns:
                - object_id
                - title
                - modified_date
            model_map:
              beleidsdoel: beleidsdoel_basic
              beleidskeuze: beleidskeuze_basic
              maatregel: maatregel_basic
              gebiedengroep: gebiedengroep_basic
              gebied: gebied_basic
              gebiedsaanwijzing: gebiedsaanwijzing_basic
            response_model_name: PagedListAllLatestObjectsResponse

columns:
  # Titel
  title:
    name: title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Filename
  filename:
    name: filename
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Omschrijving
  description:
    name: description
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Document references
  documents:
    name: documents
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Gebieden references
  gebieden:
    name: gebieden
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Target codes (gebied, gebieden for gebiedsaanwijzingen)
  target_codes:
    name: target_codes
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Hoofdlijnen references
  hoofdlijnen:
    name: hoofdlijnen
    type: json
    serializers: [ ]
    deserializers: [ ]
    nullable: true
  # area_id used to store reference to the shape
  area_id:
    name: area_id
    type: area_id
    type_data:
      relation_field: area
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # file_id used to store reference to the file
  file_id:
    name: file_id
    type: file_id
    type_data:
      relation_field: file
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Beschrijf de uitwerking van het object
  effect:
    name: effect
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Rol
  role:
    name: role
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Roles
  roles:
    name: roles
    type: json
    nullable: true
  # Toelichting
  explanation:
    name: explanation
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Gebied id
  gebied_id:
    name: gebied_id
    type: werkingsgebied_id
    type_data:
      relation_field: gebied
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Gebied Duiding
  gebied_duiding:
    name: gebied_duiding
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Primaire koppeling
  hierarchy_code:
    name: hierarchy_code
    type: object_code
    type_data:
      relation_field: hierarchy_statics
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  gebiedengroep_code:
    name: gebiedengroep_code
    type: object_code
    type_data:
      relation_field: gebiedengroep_statics
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  ref_type:
    name: ref_type
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  ref_group:
    name: ref_group
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  # Source title, used to target the Input_Geo_Werkingsgebied
  source_title:
    name: source_title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Source UUID, used to target the Input_Geo_Werkingsgebied
  source_uuid:
    name: source_uuid
    type: uuid
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Image
  image:
    name: image
    type: str
    serializers: []
    deserializers: []
    nullable: true
  # Eigenaar 1
  owner_1_id:
    name: owner_1_id
    type: user_uuid
    type_data:
      relation_field: owner_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Eigenaar 2
  owner_2_id:
    name: owner_2_id
    type: user_uuid
    type_data:
      relation_field: owner_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 1
  portfolio_holder_1_id:
    name: portfolio_holder_1_id
    type: user_uuid
    type_data:
      relation_field: portfolio_holder_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 2
  portfolio_holder_2_id:
    name: portfolio_holder_2_id
    type: user_uuid
    type_data:
      relation_field: portfolio_holder_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Opdrachtgever
  client_1_id:
    name: client_1_id
    type: user_uuid
    type_data:
      relation_field: client_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Thema's
  themas:
    name: themas
    type: json
    serializers: []
    deserializers: []
    nullable: true

