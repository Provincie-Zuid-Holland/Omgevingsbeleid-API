
model_map: &model_map
  beleidsdoel: beleidsdoel_basic
  beleidskeuze: beleidskeuze_basic
  maatregel: maatregel_basic
  gebiedengroep: gebiedengroep_basic
  gebied: gebied_basic
  gebiedsaanwijzing: gebiedsaanwijzing_basic

api:
  routers:
    - prefix: /users
      endpoints:
        - resolver: create_user
          resolver_data:
            allowed_roles:
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Beheerder"
    - prefix: /users/{user_uuid}
      endpoints:
        - resolver: get_user
        - resolver: edit_user
          resolver_data:
            allowed_roles:
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Beheerder"
    - prefix: /storage-files
      endpoints:
        - resolver: list_storage_files
    - prefix: /storage-files/{file_uuid}
      endpoints:
        - resolver: detail_storage_file
    - prefix: /storage-files/{file_uuid}/download
      endpoints:
        - resolver: download_storage_file
    - prefix: /hoofdlijnen
      endpoints:
        - resolver: create_hoofdlijn
        - resolver: list_hoofdlijnen
    - prefix: /hoofdlijnen/{hoofdlijn_uuid}
      endpoints:
        - resolver: delete_hoofdlijn
        - resolver: detail_hoofdlijn
        - resolver: edit_hoofdlijn
    - prefix: /search
      endpoints:
        - resolver: search
          resolver_data:
            search_columns:
              - Title
              - Description
            model_map: *model_map
            response_model_name: PagedSearchObjectResponse
    - prefix: /modules
      endpoints:
        - resolver: create_module
    - prefix: /modules/{module_id}
      endpoints:
        - resolver: edit_module
        - resolver: activate_module
          resolver_data:
            path: /activate
        - resolver: close_module
          resolver_data:
            path: /close
        - resolver: module_add_existing_object
          resolver_data:
            path: /add-existing-object
            allowed_object_types:
              - beleidsdoel
              - beleidskeuze
              # maatregel is left out on purpose to tests adding invalid objects
    - prefix: /objects/valid
      endpoints:
        - resolver: list_all_latest_objects
          resolver_data:
            allowed_object_types:
              - beleidsdoel
              - beleidskeuze
              - maatregel
              - gebiedengroep
              - gebied
              - gebiedsaanwijzing
            sort:
              default:
                column: Object_ID
                order: asc
              allowed_columns:
                - Object_ID
                - Title
                - Modified_Date
            model_map:
              beleidsdoel: beleidsdoel_basic
              beleidskeuze: beleidskeuze_basic
              maatregel: maatregel_basic
              gebiedengroep: gebiedengroep_basic
              gebied: gebied_basic
              gebiedsaanwijzing: gebiedsaanwijzing_basic
            response_model_name: PagedListAllLatestObjectsResponse

columns:
  # Titel
  title:
    name: Title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Filename
  filename:
    name: Filename
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Omschrijving
  description:
    name: Description
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Document references
  documents:
    name: Documents
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Gebieden references
  gebieden:
    name: Gebieden
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Target codes (gebied, gebieden for gebiedsaanwijzingen)
  target_codes:
    name: Target_Codes
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Hoofdlijnen references
  hoofdlijnen:
    name: Hoofdlijnen
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Area_UUID used to store reference to the shape
  area_uuid:
    name: Area_UUID
    type: area_uuid
    type_data:
      relation_field: Area
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # File_UUID used to store reference to the file
  file_uuid:
    name: File_UUID
    type: file_uuid
    type_data:
      relation_field: File
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Beschrijf de uitwerking van het object
  effect:
    name: Effect
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Rol
  role:
    name: Role
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Toelichting
  explanation:
    name: Explanation
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Gebied UUID
  gebied_uuid:
    name: Gebied_UUID
    type: werkingsgebied_uuid
    type_data:
      relation_field: Gebied
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Gebied Duiding
  gebied_duiding:
    name: Gebied_Duiding
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Primaire koppeling
  hierarchy_code:
    name: Hierarchy_Code
    type: object_code
    type_data:
      relation_field: Hierarchy_Statics
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  gebiedengroep_code:
    name: Gebiedengroep_Code
    type: object_code
    type_data:
      relation_field: Gebiedengroep_Statics
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  ref_type:
    name: Ref_Type
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  ref_group:
    name: Ref_Group
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  # Source Title, used to target the Input_Geo_Werkingsgebied
  source_title:
    name: Source_Title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Source UUID, # Source Title, used to target the Input_Geo_Werkingsgebied
  source_uuid:
    name: Source_UUID
    type: uuid
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Image
  image:
    name: Image
    type: str
    serializers: []
    deserializers: []
    nullable: true
  # Eigenaar 1
  owner_1_uuid:
    name: Owner_1_UUID
    type: user_uuid
    type_data:
      relation_field: Owner_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Eigenaar 2
  owner_2_uuid:
    name: Owner_2_UUID
    type: user_uuid
    type_data:
      relation_field: Owner_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 1
  portfolio_holder_1_uuid:
    name: Portfolio_Holder_1_UUID
    type: user_uuid
    type_data:
      relation_field: Portfolio_Holder_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 2
  portfolio_holder_2_uuid:
    name: Portfolio_Holder_2_UUID
    type: user_uuid
    type_data:
      relation_field: Portfolio_Holder_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Opdrachtgever
  client_1_uuid:
    name: Client_1_UUID
    type: user_uuid
    type_data:
      relation_field: Client_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Thema's
  themas:
    name: Themas
    type: json
    serializers: []
    deserializers: []
    nullable: true


