id: gebiedengroep
object_type: gebiedengroep

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - source_title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /gebiedengroepen
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: gebiedengroep_basic
            allowed_filter_columns:
              - title
              - source_title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: gebiedengroep_basic
            allowed_filter_columns:
              - title
              - source_title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedengroep_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedengroep_full
    - prefix: /gebiedengroep/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: gebiedengroep_static
        - resolver: edit_object_static
          resolver_data:
            request_model: gebiedengroep_static_post
            result_model: gebiedengroep_static_post_validated
    - prefix: /modules/{module_id}/object/gebiedengroep
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: gebiedengroep_patch
            response_model: gebiedengroep_uuid
        - resolver: input_geo_use_werkingsgebied
          resolver_data:
            path: /{lineage_id}/use/{input_geo_werkingsgebied_uuid}
            target_object_type: gebied
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: gebiedengroep_extended
            allowed_filter_columns:
              - title
              - source_title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedengroep_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedengroep_full
    - prefix: /modules/object/gebiedengroep
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/gebiedengroep/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: gebiedengroep_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  gebieden:
    name: gebieden
    type: list_str
    column: gebieden
    validators:
      - id: none_to_default_value
  source_title:
    name: source_title
    type: str
    column: source_title
    validators:
      - id: none_to_default_value
  source_uuid:
    name: source_uuid
    type: uuid
    column: source_uuid
    optional: true

  # Statics
  owner_1_uuid:
    name: owner_1_id
    type: uuid
    column: owner_1_uuid
    optional: true
  owner_2_uuid:
    name: owner_2_id
    type: uuid
    column: owner_2_uuid
    optional: true

models:
  gebiedengroep_minimal:
    name: GebiedengroepMinimal
    fields:
      object_type:
      object_id:
      id:
      title:
      source_title:
  gebiedengroep_basic:
    name: GebiedengroepBasic
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      source_title:
      start_validity:
      end_validity:
  gebiedengroep_extended:
    name: GebiedengroepExtended
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      source_title:
      source_uuid:
      gebieden:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedengroep_full:
    name: GebiedengroepFull
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      source_title:
      source_uuid:
      description:
      start_validity:
      end_validity:
      gebieden:
    dependency_model_ids:
      - user_short
    services:
      join_objects:
        to_field: gebieden_statics
        from_field: gebieden
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedengroep_patch:
    name: GebiedengroepPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      source_title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 500
          - id: plain_text
      description:
        default: none
        optional: true
  gebiedengroep_static:
    name: GebiedengroepStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedengroep_static_post:
    name: GebiedengroepStaticPost
    static_only: true
    fields:
      owner_1_uuid:
      owner_2_uuid:
  gebiedengroep_static_post_validated:
    name: GebiedengroepStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
    fields:
      owner_1_uuid:
      owner_2_uuid:
  gebiedengroep_uuid:
    name: GebiedengroepUUID
    fields:
      object_id:
      id:
  gebiedengroep_module_validate:
    name: GebiedengroepModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      gebieden:
        optional: false
        validators:
          - id: object_codes_allowed_type
            data:
              allowed_object_types:
                - gebied
          - id: object_codes_exists
          - id: not_empty
