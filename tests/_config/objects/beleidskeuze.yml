id: beleidskeuze
object_type: beleidskeuze

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /beleidskeuzes
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: beleidskeuze_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: beleidskeuze_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: beleidskeuze_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: beleidskeuze_full
        - resolver: list_relations
          resolver_data:
            path: /relations/{lineage_id}
        - resolver: overwrite_relations
          resolver_data:
            path: /relations/{lineage_id}
            allowed_object_types_relations:
              - wettelijke_taak
              - nationaal_belang
              - beleidsdoel
              - beleidsregel
              - maatregel
    - prefix: /beleidskeuze/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: beleidskeuze_static
        - resolver: edit_object_static
          resolver_data:
            request_model: beleidskeuze_static_post
            result_model: beleidskeuze_static_post_validated
    - prefix: /beleidskeuze/acknowledged-relations/{lineage_id}
      endpoints:
        - resolver: list_acknowledged_relations
        - resolver: request_acknowledged_relation
          resolver_data:
            allowed_object_types:
              - beleidskeuze
        - resolver: edit_acknowledged_relation
          resolver_data:
            path: /edit
    - prefix: /modules/{module_id}/object/beleidskeuze
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: beleidskeuze_patch
            response_model: beleidskeuze_uuid
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: beleidskeuze_extended
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: beleidskeuze_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: beleidskeuze_full
    - prefix: /modules/objects/beleidskeuze
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/beleidskeuze/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: beleidskeuze_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  explanation:
    name: explanation
    type: str
    column: explanation
    validators:
      - id: none_to_default_value
  hierarchy_code:
    name: hierarchy_code
    type: str
    column: hierarchy_code
    validators:
      - id: none_to_default_value
  gebiedengroep_code:
    name: gebiedengroep_code
    type: str
    column: gebiedengroep_code
    optional: true
    default: none
    validators:
      - id: none_to_default_value
  themas:
    name: themas
    type: list_str
    column: themas
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_uuid:
    name: owner_1_id
    type: uuid
    column: owner_1_uuid
    optional: true
  owner_2_uuid:
    name: owner_2_id
    type: uuid
    column: owner_2_uuid
    optional: true
  portfolio_holder_1_uuid:
    name: portfolio_holder_1_id
    type: uuid
    column: portfolio_holder_1_uuid
    optional: true
  portfolio_holder_2_uuid:
    name: portfolio_holder_2_id
    type: uuid
    column: portfolio_holder_1_uuid
    optional: true
  client_1_uuid:
    name: client_1_id
    type: uuid
    column: client_1_uuid
    optional: true

models:
  beleidskeuze_minimal:
    name: BeleidskeuzeMinimal
    fields:
      object_type:
      object_id:
      id:
      title:
  beleidskeuze_basic:
    name: BeleidskeuzeBasic
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
    services:
      next_object_version:
        to_field: next_version
  beleidskeuze_extended:
    name: BeleidskeuzeExtended
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
      hierarchy_code:
      gebiedengroep_code:
      themas:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  beleidskeuze_full:
    name: BeleidskeuzeFull
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
      description:
      explanation:
      hierarchy_code:
      gebiedengroep_code:
      themas:
    dependency_model_ids:
      - user_short
      - hierarchy_statics
      - nationaal_belang_minimal
      - beleidsdoel_minimal
      - maatregel_minimal
    services:
      next_object_version:
        to_field: next_version
      public_revisions:
        to_field: public_revisions
      join_gebiedengroepen:
        to_field: gebiedengroep_static
        from_field: gebiedengroep_code
      join_gebiedsaanwijzingen:
        to_field: gebiedsaanwijzingen_statics
        from_fields:
          - description
          - explanation
      insert_assets:
        fields:
          - description
          - explanation
      foreign_keys_extender:
        fields_map:
          - to_field: hierarchy_statics
            model_id: hierarchy_statics
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
      resolve_child_objects_via_hierarchy_listener:
        to_field: hierarchy_children
      relations:
        objects:
          - object_type: beleidsdoel
            object_id: beleidsdoel
            to_field: "Beleidsdoelen"
            model_id: beleidsdoel_minimal
            wrapped_with_relation_data: true
          - object_type: maatregel
            object_id: maatregel
            to_field: "Maatregelen"
            model_id: maatregel_minimal
            wrapped_with_relation_data: true
  beleidskeuze_patch:
    name: BeleidskeuzePatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        default: none
        optional: true
        validators:
          - id: html
          - id: gebiedsaanwijzing_in_text
            data:
              allowed_code_types:
                - gebiedsaanwijzing
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
      explanation:
        default: none
        optional: true
        validators:
          - id: html
          - id: gebiedsaanwijzing_in_text
            data:
              allowed_code_types:
                - gebiedsaanwijzing
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
      hierarchy_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - beleidsdoel
          - id: object_code_exists
      gebiedengroep_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - gebiedengroep
          - id: object_code_exists
      themas:
        optional: true
    services:
      extract_assets:
        fields:
          - description
          - explanation
  beleidskeuze_static:
    name: BeleidskeuzeStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  beleidskeuze_static_post:
    name: BeleidskeuzeStaticPost
    static_only: true
    fields:
      owner_1_uuid:
      owner_2_uuid:
      portfolio_holder_1_uuid:
      portfolio_holder_2_uuid:
      client_1_uuid:
  beleidskeuze_static_post_validated:
    name: BeleidskeuzeStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
      - id: not_equal_root
        data:
          fields:
            - portfolio_holder_1_id
            - portfolio_holder_2_id
          allow_none: True
          error_message: Portfolio Holders should vary
    fields:
      owner_1_uuid:
      owner_2_uuid:
      portfolio_holder_1_uuid:
      portfolio_holder_2_uuid:
      client_1_uuid:
  beleidskeuze_uuid:
    name: BeleidskeuzeUUID
    fields:
      object_id:
      id:
  beleidskeuze_module_validate:
    name: BeleidskeuzeModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        validators:
          - id: length
            data:
              min: 3
          - id: html
      explanation:
        optional: true
        validators:
          - id: none_to_default_value
          - id: length
            data:
              min: 3
          - id: html
      hierarchy_code:
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - beleidsdoel
          - id: object_code_exists
