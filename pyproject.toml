[project]
name = "omgevingsbeleid"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "azure-monitor-opentelemetry>=1.8.10",
    "bcrypt==4.0.1",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "dependency-injector>=4.49.1",
    "diff-match-patch>=20241021",
    "dso",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.2.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "passlib>=1.7.4",
    "pikepdf>=10.16.0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "python-slugify>=9.1.3",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "validators>=0.35.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "E712",   # true-false-comparison: Which is unreadable in sqlalchemy filters
    "SIM102", # collapsible-if: nested ifs often check separate things and read better apart
    "DTZ007", # strptime-without-zone: we parse date-only strings of which I'm not sure that we can safely set the timezone without code breaking
    "TRY004", # type-check-without-type-error: TypeError escapes pydantic validators (422 becomes 500)
    "TRY203", # useless-try-except:
    "BLE001", # blind-except:
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"] # unused-import: Which is oke for __init__.py files

[tool.pytest.ini_options]
norecursedirs = "*venv* *.venv* *.pytest_cache* .hidden"
testpaths = "tests"
python_files = "*_test.py"

env = [
    "D:SQLALCHEMY_DATABASE_URI=sqlite:///:memory:",
    "D:SQLALCHEMY_ECHO=false",
    "D:MAIN_CONFIG_FILE=./tests/_config/main.yml",
    "D:OBJECT_CONFIG_PATH=./tests/_config/objects/",
    "D:SECRET_KEY=secret-key-which-is-at-least-32-bytes-long",
]

filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app"]
relative_files = true


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "coverage-badge>=1.1.2",
    "debugpy>=1.8.22",
    "devtools>=0.12.2",
    "faker>=40.41.0",
    "freezegun>=1.5.5",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.1",
    "pytest-freezer>=0.4.9",
    "pytest-mock>=3.16.0",
    "requests-mock>=1.12.1",
    "rich>=15.0.0",
    "ruff>=0.16.10",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = false, tags = true } }]

[tool.uv.sources]
dso = { git = "https://github.com/Provincie-Zuid-Holland/Omgevingsbeleid-DSO.git", rev = "v0.14.0" }

