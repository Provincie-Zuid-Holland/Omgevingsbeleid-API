    name: ref_type
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  ref_group:
    name: ref_group
    type: str
    serializers: ["optional_str"]
    deserializers: ["optional_str"]
    nullable: true
  # Source Title, used to target the Input_Geo_Werkingsgebied
  source_title:
    name: source_title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Source UUID, # Source Title, used to target the Input_Geo_Werkingsgebied
  source_uuid:
    name: source_uuid
    type: uuid
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Image
  image:
    name: image
    type: str
    serializers: []
    deserializers: []
    nullable: true
  # Eigenaar 1
  owner_1_id:
    name: owner_1_id
    type: user_uuid
    type_data:
      relation_field: owner_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Eigenaar 2
  owner_2_id:
    name: owner_2_id
    type: user_uuid
    type_data:
      relation_field: owner_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 1
  portfolio_holder_1_id:
    name: portfolio_holder_1_id
    type: user_uuid
    type_data:
      relation_field: portfolio_holder_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Portefeuillehouder 2
  portfolio_holder_2_id:
    name: portfolio_holder_2_id
    type: user_uuid
    type_data:
      relation_field: portfolio_holder_2
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Opdrachtgever
  client_1_id:
    name: client_1_id
    type: user_uuid
    type_data:
      relation_field: client_1
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
    static: true
  # Thema's
  themas:
    name: themas
    type: json
    serializers: []
    deserializers: []
    nullable: true


users_permissions:
  "Behandelend Ambtenaar":
    # Module Object
