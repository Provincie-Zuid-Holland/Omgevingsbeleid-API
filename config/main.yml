    name: idms_link
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Gebied id
  gebied_id:
    name: gebied_id
    type: werkingsgebied_id
    type_data:
      relation_field: gebied
    serializers: ["optional_str"]
    deserializers: ["optional_uuid"]
    nullable: true
  # Gebied Duiding
