  decision_number:
    name: decision_number
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Toelichting
  explanation:
    name: explanation
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Weblink
  weblink:
    name: weblink
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # IDMS Link
