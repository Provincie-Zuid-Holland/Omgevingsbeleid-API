sort_allowed_object_columns: &sort_allowed_object_columns
  - object_id
  - title
  - modified_date

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_object_columns

sort_default_object_id: &sort_default_object_id
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_object_columns

validate_rules:
  module:
    area_designation_ref_check:
      object_type: gebiedsaanwijzing
      ref_type_field: ref_type
      ref_group_field: ref_group
    check_empty_area_designation_text:
      fields:
        - description
        - cause
        - provincial_interest
        - explanation
        - role
        - effect
    forbid_empty_html_nodes:
      fields:
        - description
        - cause
        - provincial_interest
        - explanation
        - role
        - effect
      html_void_elements:
        - area
        - base
        - br
        - col
        - embed
        - hr
        - img
        - input
        - link
        - meta
        - param
        - source
        - track
        - wbr
      allowed_empty_when_sole_child:
        td:
          - p
        th:
          - p
    forbidden_html_tags:
      fields:
        - description
        - cause
        - provincial_interest
        - explanation
        - role
        - effect
      forbidden_html_tags:
      - h1
      - h2
    hoofdlijnen_check:
      field: hoofdlijnen
      allowed_object_types:
        - ambitie
        - beleidsdoel
        - beleidskeuze
        - maatregel
    newest_input_geo_onderverdeling_used:
      object_type: gebied
      field: area
    require_existing_hierarchy_code:
      field: hierarchy_code
    required_object_fields:
      ambitie: ambitie_module_validate
      beleidsdoel: beleidsdoel_module_validate
      beleidskeuze: beleidskeuze_module_validate
      document: document_module_validate
      maatregel: maatregel_module_validate
      programma_algemeen: programma_module_validate
      visie_algemeen: visie_algemeen_module_validate
      gebied: gebied_module_validate
      gebiedengroep: gebiedengroep_module_validate
      gebiedsaanwijzing: gebiedsaanwijzing_module_validate
    themas_check:
      field: themas
  publication:
    bill_compact_forbidden_tags:
      fields:
        - preamble
        - closing
        - signed
        - amendment_article
        - time_article
      forbidden_tags:
        - al
    forbidden_html_tags:
      fields:
        - description
        - cause
        - provincial_interest
        - explanation
        - role
        - effect
      forbidden_html_tags:
      - h1
      - h2
    hoofdlijnen_check:
      field: hoofdlijnen
      allowed_object_types:
        - ambitie
        - beleidsdoel
        - beleidskeuze
        - maatregel
    required_object_fields:
      omgevingsvisie:
        ambitie: ambitie_module_validate
        beleidsdoel: beleidsdoel_module_validate
        beleidskeuze: beleidskeuze_module_validate
        document: document_module_validate
        visie_algemeen: visie_algemeen_module_validate
      programma:
        document: document_module_validate
        maatregel: maatregel_module_validate
        programma_algemeen: programma_module_validate
        beleidsdoel: beleidsdoel_module_validate
    themas_check:
      field: themas

model_map: &model_map
  ambitie: ambitie_basic
  beleidsdoel: beleidsdoel_basic
  beleidskeuze: beleidskeuze_basic
  beleidsregel: beleidsregel_basic
  document: document_basic
  gebiedsprogramma: gebiedsprogramma_basic
  maatregel: maatregel_basic
  nationaal_belang: nationaal_belang_basic
  gebiedengroep: gebiedengroep_basic
  gebied: gebied_basic
  gebiedsaanwijzing: gebiedsaanwijzing_basic
  programma_algemeen: programma_algemeen_basic
  verplicht_programma: verplicht_programma_basic
  visie_algemeen: visie_algemeen_basic
  werkingsgebied: werkingsgebied_basic
  wettelijke_taak: wettelijke_taak_basic

api:
  routers:
    - prefix: /login/access-token
      endpoints:
        - resolver: auth_login_access_token
    - prefix: /password-reset
      endpoints:
        - resolver: auth_reset_password
    - prefix: /users
      endpoints:
        - resolver: list_users
          resolver_data:
            sort:
              default:
                column: Gebruikersnaam
                order: asc
              allowed_columns:
                - Gebruikersnaam
                - Email
        - resolver: create_user
          resolver_data:
            allowed_roles:
              - "Ambtelijk opdrachtgever"
              - "Basic"
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Regisseur Omgevingsbeleid"

    - prefix: /users/search
      endpoints:
        - resolver: search_users
          resolver_data:
            sort:
              default:
                column: Gebruikersnaam
                order: asc
              allowed_columns:
                - Gebruikersnaam
                - Email
    - prefix: /users/{user_uuid}
      endpoints:
        - resolver: get_user
        - resolver: edit_user
          resolver_data:
            allowed_roles:
              - "Ambtelijk opdrachtgever"
              - "Basic"
              - "Behandelend Ambtenaar"
              - "Portefeuillehouder"
              - "Regisseur Omgevingsbeleid"
        - resolver: reset_user_password
          resolver_data:
            path: /reset-password
    - prefix: /source-werkingsgebieden
      endpoints:
        - resolver: source_list_werkingsgebieden
          resolver_data:
            sort:
              default:
                column: title
                order: asc
              allowed_columns:
                - title
                - id
                - created_date
                - modified_date
    - prefix: /search
      endpoints:
        - resolver: search
          resolver_data:
            search_columns:
              - title
              - description
              # @note: These were not used in the previous setup. Should discuss if they should be used
              # - effect
              # - provincial_interest
              # - cause
            model_map: *model_map
            response_model_name: PagedSearchObjectResponse
    - prefix: /full-graph
      endpoints:
        - resolver: full_graph
    - prefix: /object-graph
      endpoints:
        - resolver: object_graph
          resolver_data:
            graph_iterations:
              relations:
                - allowed_object_types:
                  - ambitie
                  - beleidsdoel
                  - beleidskeuze
                  - maatregel
                - allowed_object_types:
                  - ambitie
              acknowledged_relations:
                - allowed_object_types:
                  - beleidskeuze
    - prefix: /revisions
      endpoints:
        - resolver: public_list_modules
        - resolver: public_module_overview
          resolver_data:
            path: /{module_id}
    - prefix: /storage-files
      endpoints:
        - resolver: list_storage_files
        - resolver: storage_file_upload_file
    - prefix: /storage-files/{file_uuid}
      endpoints:
        - resolver: detail_storage_file
    - prefix: /storage-files/{file_uuid}/download
      endpoints:
        - resolver: download_storage_file
    - prefix: /hoofdlijnen
      endpoints:
        - resolver: create_hoofdlijn
        - resolver: list_hoofdlijnen
          resolver_data:
            sort:
              default:
                column: created_date
                order: desc
              allowed_columns:
                - created_date
                - name
                - type
    - prefix: /hoofdlijnen/search
      endpoints:
        - resolver: search_hoofdlijn
          resolver_data:
            sort:
              default:
                column: created_date
                order: desc
              allowed_columns:
                - created_date
                - name
                - type
    - prefix: /hoofdlijnen/{hoofdlijn_uuid}
      endpoints:
        - resolver: delete_hoofdlijn
        - resolver: detail_hoofdlijn
        - resolver: edit_hoofdlijn
    - prefix: /modules
      endpoints:
        - resolver: create_module
        - resolver: list_modules
    - prefix: /modules/{module_id}
      endpoints:
        - resolver: module_overview
        - resolver: edit_module
        - resolver: validate_module
          resolver_data:
            path: /validate
        - resolver: activate_module
          resolver_data:
            path: /activate
        - resolver: complete_module
          resolver_data:
            path: /complete
        - resolver: close_module
          resolver_data:
            path: /close
        - resolver: module_list_statuses
          resolver_data:
            path: /status
        - resolver: module_patch_status
          resolver_data:
            path: /status
        - resolver: module_add_new_object
          resolver_data:
            path: /add-new-object
            allowed_object_types:
              - ambitie
              - beleidsdoel
              - beleidskeuze
              - maatregel
              - beleidsregel
              - gebiedsprogramma
              - visie_algemeen
              - programma_algemeen
              - werkingsgebied
              - document
              - gebiedengroep
              - gebiedsaanwijzing
        - resolver: module_add_existing_object
          resolver_data:
            path: /add-existing-object
            allowed_object_types:
              - ambitie
              - beleidsdoel
              - beleidskeuze
              - maatregel
              - beleidsregel
              - gebiedsprogramma
              - visie_algemeen
              - programma_algemeen
              - werkingsgebied
              - document
              - gebiedengroep
              - gebiedsaanwijzing
        - resolver: module_get_object_context
          resolver_data:
            path: /object-context/{object_type}/{lineage_id}
        - resolver: module_edit_object_context
          resolver_data:
            path: /object-context/{object_type}/{lineage_id}
        - resolver: module_remove_object
          resolver_data:
            path: /remove/{object_type}/{lineage_id}
        - resolver: module_snapshot
          resolver_data:
            path: /snapshot/{status_id}
    - prefix: /modules/objects/latest
      endpoints:
        - resolver: list_module_objects
          resolver_data:
            sort:
              default:
                column: modified_date
                order: desc
              allowed_columns:
                - object_id
                - title
                - modified_date
                - object_type
                - action
            model_map: *model_map
            response_model_name: PagedListModuleObjectsResponse
    - prefix: /objects/valid
      endpoints:
        - resolver: object_counts
          resolver_data:
            path: /count
        - resolver: list_all_latest_objects
          resolver_data:
            allowed_object_types:
              - ambitie
              - beleidsdoel
              - beleidskeuze
              - document
              - maatregel
              - beleidsregel
              - gebiedsprogramma
              - wettelijke_taak
              - nationaal_belang
              - verplicht_programma
              - visie_algemeen
              - programma_algemeen
              - werkingsgebied
              - gebiedengroep
              - gebied
              - gebiedsaanwijzing
            sort: *sort_default_object_id
            model_map: *model_map
            response_model_name: PagedListAllLatestObjectsResponse
    - prefix: /publication-aoj
      endpoints:
        - resolver: create_publication_area_of_jurisdictions
        - resolver: list_publication_area_of_jurisdictions
    - prefix: /publication-templates
      endpoints:
        - resolver: create_publication_template
        - resolver: edit_publication_template
          resolver_data:
            path: /{template_uuid}
        - resolver: detail_publication_template
          resolver_data:
            path: /{template_uuid}
        - resolver: list_publication_templates
    - prefix: /publication-acts
      endpoints:
        - resolver: create_publication_act
        - resolver: close_publication_act
          resolver_data:
            path: /{act_uuid}/close
        - resolver: edit_publication_act
          resolver_data:
            path: /{act_uuid}
        - resolver: detail_publication_act
          resolver_data:
            path: /{act_uuid}
        - resolver: list_publication_acts
    - prefix: /publication-environments
      endpoints:
        - resolver: create_publication_environment
        - resolver: edit_publication_environment
          resolver_data:
            path: /{environment_uuid}
        - resolver: detail_publication_environment
          resolver_data:
            path: /{environment_uuid}
        - resolver: list_publication_environments
    - prefix: /publications
      endpoints:
        - resolver: list_publications
        - resolver: create_publication
    - prefix: /publications/{publication_uuid}
      endpoints:
        - resolver: detail_publication
        - resolver: edit_publication
        - resolver: create_publication_version
          resolver_data:
            path: /version
        - resolver: list_publication_versions
          resolver_data:
            path: /versions
    # Publication Version flow
    - prefix: /publication-versions/{version_uuid}
      endpoints:
        - resolver: edit_publication_version
        - resolver: detail_publication_version
        - resolver: delete_publication_version
    - prefix: /publication-versions/{version_uuid}/attachments
      endpoints:
        - resolver: upload_publication_version_attachment
        - resolver: list_publication_version_attachment
    - prefix: /publication-versions/{version_uuid}/attachments/{attachment_id}
      endpoints:
        - resolver: delete_publication_version_attachment
        - resolver: download_publication_version_attachment
    - prefix: /publication-versions/{version_uuid}/pdf_export
      endpoints:
        - resolver: create_publication_version_pdf
    - prefix: /publication-versions/{version_uuid}/packages
      endpoints:
        - resolver: create_publication_act_package
    - prefix: /publication-act-packages
      endpoints:
        - resolver: list_publication_act_packages
          resolver_data:
            sort:
              <<: *sort_default_modified_date
              allowed_columns:
                - modified_date
                - created_date
    - prefix: /publication-act-packages/{act_package_uuid}
      endpoints:
        - resolver: detail_publication_act_package
        - resolver: abort_publication_act_package
          resolver_data:
            path: /abort
        - resolver: download_publication_act_package
          resolver_data:
            path: /download
        - resolver: upload_publication_act_package_report
          resolver_data:
            path: /report
    - prefix: /publication-act-packages/{version_uuid}/validate
      endpoints:
        - resolver: validate_publication_act_package
    - prefix: /publication-act-reports
      endpoints:
        - resolver: list_publication_act_package_reports
    - prefix: /publication-act-reports/{act_report_uuid}
      endpoints:
        - resolver: detail_publication_act_package_report
        - resolver: download_publication_act_package_report
          resolver_data:
            path: /download
    # Announcement flow
    - prefix: /publication-act-packages/{act_package_uuid}/create-announcement
      endpoints:
        - resolver: create_publication_announcement
    - prefix: /publication-announcements
      endpoints:
        - resolver: list_publication_announcements
    - prefix: /publication-announcements/{announcement_uuid}
      endpoints:
        - resolver: edit_publication_announcement
        - resolver: detail_publication_announcement
    - prefix: /publication-announcements/{announcement_uuid}/pdf_export
      endpoints:
        - resolver: create_announcement_pdf
    - prefix: /publication-announcements/{announcement_uuid}/packages
      endpoints:
        - resolver: create_publication_announcement_package
    - prefix: /publication-announcement-packages
      endpoints:
        - resolver: list_publication_announcement_packages
          resolver_data:
            sort:
              <<: *sort_default_modified_date
              allowed_columns:
                - modified_date
                - created_date
    - prefix: /publication-announcement-packages/{announcement_package_uuid}
      endpoints:
        - resolver: detail_publication_announcement_package
        - resolver: download_publication_announcement_package
          resolver_data:
            path: /download
        - resolver: upload_publication_announcement_package_report
          resolver_data:
            path: /report
    - prefix: /publication-announcement-reports
      endpoints:
        - resolver: list_publication_announcement_package_reports
    - prefix: /publication-announcement-reports/{announcement_report_uuid}
      endpoints:
        - resolver: detail_publication_announcement_package_report
        - resolver: download_publication_announcement_package_report
          resolver_data:
            path: /download
    # Unified packages (both act and announcement)
    - prefix: /publication-packages
      endpoints:
        - resolver: list_unified_publication_packages
          resolver_data:
            sort:
              default:
                column: created_date
                order: DESC
              allowed_columns:
                - created_date
                - modified_date
                - package_type
                - report_status
                - module_id
                - publication_type
                - document_type
                - module_title
    # DSO value list getters
    - prefix: /publication-dso-value-lists
      endpoints:
        - resolver: list_area_designation
          resolver_data:
            path: /area-designation
        - resolver: list_thema
          resolver_data:
            path: /thema
    # Input GEO
    - prefix: /input-geo/werkingsgebieden
      endpoints:
        - resolver: input_geo_latest_werkingsgebieden
          resolver_data:
            path: /latest
        - resolver: input_geo_werkingsgebieden_history
          resolver_data:
            path: /history
        - resolver: input_geo_werkingsgebieden_detail
          resolver_data:
            path: /detail/{input_geo_werkingsgebied_uuid}

columns:
  # Titel
  title:
    name: title
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Filename
  filename:
    name: filename
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Omschrijving
  description:
    name: description
    type: str
    serializers: []
    deserializers: ["str"]
    nullable: true
  # Document references
  documents:
    name: documents
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Onderverdeling references @deprecated
  onderverdelingen:
    name: onderverdelingen
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Gebieden references
  gebieden:
    name: gebieden
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Target codes (gebied, gebieden for gebiedsaanwijzingen)
  target_codes:
    name: target_codes
    type: json
    serializers: []
    deserializers: []
    nullable: true
  # Hoofdlijnen references
