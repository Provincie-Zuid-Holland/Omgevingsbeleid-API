id: nationaal_belang
object_type: nationaal_belang

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /nationaal-belang
      endpoints:
        - resolver: atemporal_create_object
          resolver_data:
            request_model: nationaal_belang_create
            response_model: nationaal_belang_id
        - resolver: atemporal_edit_object
          resolver_data:
            path: /{lineage_id}
            request_model: nationaal_belang_edit
        - resolver: atemporal_delete_object
          resolver_data:
            path: /{lineage_id}
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: nationaal_belang_basic
            allowed_filter_columns:
              - title
              - weblink
            sort: *sort_default_title
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: nationaal_belang_full
        - resolver: list_relations
          resolver_data:
            path: /relations/{lineage_id}
        - resolver: overwrite_relations
          resolver_data:
            path: /relations/{lineage_id}
            allowed_object_types_relations:
              - beleidskeuze
    - prefix: /nationaal-belang/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: nationaal_belang_static
        - resolver: edit_object_static
          resolver_data:
            request_model: nationaal_belang_static_post
            result_model: nationaal_belang_static_post_validated
            response_model: nationaal_belang_basic

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  weblink:
    name: weblink
    type: str
    column: weblink
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true

models:
  nationaal_belang_minimal:
    name: NationaalBelangMinimal
    fields:
      object_type:
      object_id:
      code:
      id:
      created_date:
      modified_date:
      title:
      weblink:
  nationaal_belang_basic:
    name: NationaalBelangBasic
    fields:
      object_type:
      object_id:
      code:
      id:
      created_date:
      modified_date:
      title:
      weblink:
  nationaal_belang_extended:
    name: NationaalBelangExtended
    fields:
      object_type:
      object_id:
      code:
      id:
      created_date:
      modified_date:
      title:
      weblink:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  nationaal_belang_full:
    name: NationaalBelangFull
    fields:
      object_type:
      object_id:
      code:
      id:
      created_date:
      modified_date:
      title:
      weblink:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
      - beleidskeuze_minimal
    services:
      relations:
        objects:
          - object_type: beleidskeuze
            object_id: beleidskeuze
            to_field: "Beleidskeuzes"
            model_id: beleidskeuze_minimal
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  nationaal_belang_create:
    name: NationaalBelangCreate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      weblink:
        optional: true
        validators:
          - id: plain_text
      owner_1_id:
      owner_2_id:
  nationaal_belang_edit:
    name: NationaalBelangEdit
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      weblink:
        default: none
        optional: true
        validators:
          - id: plain_text
  nationaal_belang_static:
    name: NationaalBelangStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  nationaal_belang_static_post:
    name: NationaalBelangStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
  nationaal_belang_static_post_validated:
    name: NationaalBelangStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
    fields:
      owner_1_id:
      owner_2_id:
  nationaal_belang_id:
    name: NationaalBelangUUID
    fields:
      object_id:
      id:
