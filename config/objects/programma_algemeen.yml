id: programma_algemeen
object_type: programma_algemeen

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /programmas-algemeen
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: programma_algemeen_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: programma_algemeen_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: programma_algemeen_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: programma_algemeen_full
    - prefix: /programma-algemeen/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: programma_algemeen_static
        - resolver: edit_object_static
          resolver_data:
            request_model: programma_algemeen_static_post
            result_model: programma_algemeen_static_post_validated
    - prefix: /modules/{module_id}/object/programma-algemeen
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: programma_algemeen_patch
            response_model: programma_algemeen_id
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: programma_algemeen_extended
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: programma_algemeen_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: programma_algemeen_full
    - prefix: /modules/object/programma-algemeen
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/programma-algemeen/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: programma_algemeen_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  idms_link:
    name: idms_link
    type: str
    column: idms_link
    validators:
      - id: none_to_default_value
  decision_number:
    name: decision_number
    type: str
    column: decision_number
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true

models:
  programma_algemeen_minimal:
    name: ProgrammaAlgemeenMinimal
    fields:
      object_type:
      object_id:
      id:
      title:
  programma_algemeen_basic:
    name: ProgrammaAlgemeenBasic
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      start_validity:
      end_validity:
    services:
      next_object_version:
        to_field: next_version
  programma_algemeen_extended:
    name: ProgrammaAlgemeenExtended
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  programma_algemeen_full:
    name: ProgrammaAlgemeenFull
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      description:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      next_object_version:
        to_field: next_version
      public_revisions:
        to_field: public_revisions
      insert_assets:
        fields:
          - description
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
      join_gebiedsaanwijzingen:
        to_field: gebiedsaanwijzingen_statics
        from_fields:
          - description
  programma_algemeen_patch:
    name: ProgrammaAlgemeenPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        default: none
        optional: true
        validators:
          - id: html
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
          - id: gebiedsaanwijzing_in_text
            data:
              allowed_code_types:
                - gebiedsaanwijzing
    services:
      extract_assets:
        fields:
          - description
  programma_algemeen_static:
    name: ProgrammaAlgemeenStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  programma_algemeen_static_post:
    name: ProgrammaAlgemeenStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
  programma_algemeen_static_post_validated:
    name: ProgrammaAlgemeenStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
    fields:
      owner_1_id:
      owner_2_id:
  programma_algemeen_id:
    name: ProgrammaAlgemeenUUID
    fields:
      object_id:
      id:
  programma_module_validate:
    name: ProgrammaModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        validators:
          - id: length
            data:
              min: 3
          - id: html
