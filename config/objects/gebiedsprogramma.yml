id: gebiedsprogramma
object_type: gebiedsprogramma

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /gebiedsprogrammas
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: gebiedsprogramma_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: gebiedsprogramma_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedsprogramma_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedsprogramma_full
        - resolver: list_relations
          resolver_data:
            path: /relations/{lineage_id}
        - resolver: overwrite_relations
          resolver_data:
            path: /relations/{lineage_id}
            allowed_object_types_relations:
              - maatregel
    - prefix: /gebiedsprogrammas/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: gebiedsprogramma_static
        - resolver: edit_object_static
          resolver_data:
            request_model: gebiedsprogramma_static_post
            result_model: gebiedsprogramma_static_post_validated
    - prefix: /modules/{module_id}/object/gebiedsprogrammas
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: gebiedsprogramma_patch
            response_model: gebiedsprogramma_id
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: gebiedsprogramma_extended
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedsprogramma_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedsprogramma_full
    - prefix: /modules/objects/gebiedsprogramma
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/gebiedsprogramma/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: gebiedsprogramma_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False


fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  image:
    name: image
    type: str
    column: image
    validators:
      - id: none_to_default_value
  idms_link:
    name: idms_link
    type: str
    column: idms_link
    validators:
      - id: none_to_default_value
  decision_number:
    name: decision_number
    type: str
    column: decision_number
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true
  portfolio_holder_1_id:
    name: portfolio_holder_1_id
    type: uuid
    column: portfolio_holder_1_id
    optional: true
  portfolio_holder_2_id:
    name: portfolio_holder_2_id
    type: uuid
    column: portfolio_holder_1_id
    optional: true
  client_1_id:
    name: client_1_id
    type: uuid
    column: client_1_id
    optional: true

models:
  gebiedsprogramma_minimal:
    name: GebiedsprogrammaMinimal
    fields:
      object_type:
      object_id:
      uuid:
      title:
  gebiedsprogramma_basic:
    name: GebiedsprogrammaBasic
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      start_validity:
      end_validity:
      image:
        default: none
        optional: true
    services:
      next_object_version:
        to_field: next_version
      get_image:
        fields:
          - image
  gebiedsprogramma_extended:
    name: GebiedsprogrammaExtended
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      start_validity:
      end_validity:
      image:
        default: none
        optional: true
    dependency_model_ids:
      - user_short
    services:
      get_image:
        fields:
          - image
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  gebiedsprogramma_full:
    name: GebiedsprogrammaFull
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      description:
      start_validity:
      end_validity:
      image:
        default: none
        optional: true
    dependency_model_ids:
      - user_short
      - hierarchy_statics
      - maatregel_minimal
    services:
      next_object_version:
        to_field: next_version
      public_revisions:
        to_field: public_revisions
      insert_assets:
        fields:
          - description
      get_image:
        fields:
          - image
      relations:
        objects:
          - object_type: maatregel
            object_id: maatregel
            to_field: "Maatregelen"
            model_id: maatregel_minimal
            wrapped_with_relation_data: true
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  gebiedsprogramma_patch:
    name: GebiedsprogrammaPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        default: none
        optional: true
        validators:
          - id: html
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
      image:
        default: none
        optional: true
        validators:
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
    services:
      extract_assets:
        fields:
          - description
      store_image:
        fields:
          - image
  gebiedsprogramma_static:
    name: GebiedsprogrammaStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  gebiedsprogramma_static_post:
    name: GebiedsprogrammaStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
      portfolio_holder_1_id:
      portfolio_holder_2_id:
      client_1_id:
  gebiedsprogramma_static_post_validated:
    name: GebiedsprogrammaStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
      - id: not_equal_root
        data:
          fields:
            - portfolio_holder_1_id
            - portfolio_holder_2_id
          allow_none: True
          error_message: Portfolio Holders should vary
    fields:
      owner_1_id:
      owner_2_id:
      portfolio_holder_1_id:
      portfolio_holder_2_id:
      client_1_id:
  gebiedsprogramma_id:
    name: GebiedsprogrammaUUID
    fields:
      object_id:
      uuid:
