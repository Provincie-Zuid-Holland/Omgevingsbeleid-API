id: maatregel
object_type: maatregel

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

roles_allowed_values_list_data: &roles_allowed_values_list_data
  allowed_values:
    - "Presterende provincie: waar overheidsinvesteringen onmisbaar zijn, zelf prestaties leveren."
    - "Samenwerkende provincie: waar (meer) regie nodig is, netwerkend werken."
    - "Rechtmatige provincie: waar normerend optreden noodzakelijk is, wettelijke bevoegdheden inzetten."
    - "Responsieve provincie: zoveel mogelijk overlaten aan initiatieven uit de samenleving."

api:
  routers:
    - prefix: /maatregelen
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: maatregel_basic
            allowed_filter_columns:
              - title
              - weblink
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: maatregel_basic
            allowed_filter_columns:
              - title
              - weblink
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: maatregel_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: maatregel_full
        - resolver: list_relations
          resolver_data:
            path: /relations/{lineage_id}
        - resolver: overwrite_relations
          resolver_data:
            path: /relations/{lineage_id}
            allowed_object_types_relations:
              - beleidskeuze
              - gebiedsprogramma
              - verplicht_programma
    - prefix: /maatregel/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: maatregel_static
        - resolver: edit_object_static
          resolver_data:
            request_model: maatregel_static_post
            result_model: maatregel_static_post_validated
    - prefix: /modules/{module_id}/object/maatregel
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: maatregel_patch
            response_model: maatregel_id
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: maatregel_extended
            allowed_filter_columns:
              - title
              - weblink
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: maatregel_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: maatregel_full
    - prefix: /modules/objects/maatregel
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/maatregel/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: maatregel_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  role:
    name: role
    type: str
    column: role
    validators:
      - id: none_to_default_value
  roles:
    name: roles
    type: list_str
    column: roles
    validators:
      - id: none_to_default_value
  effect:
    name: effect
    type: str
    column: effect
    validators:
      - id: none_to_default_value
  idms_link:
    name: idms_link
    type: str
    column: idms_link
    validators:
      - id: none_to_default_value
  decision_number:
    name: decision_number
    type: str
    column: decision_number
    validators:
      - id: none_to_default_value
  documents:
    name: documents
    type: list_str
    column: documents
    validators:
      - id: none_to_default_value
  hierarchy_code:
    name: hierarchy_code
    type: str
    column: hierarchy_code
    validators:
      - id: none_to_default_value
  werkingsgebied_code:
    name: werkingsgebied_code
    type: str
    column: werkingsgebied_code
    validators:
      - id: none_to_default_value
  gebiedengroep_code:
    name: gebiedengroep_code
    type: str
    column: gebiedengroep_code
    optional: true
    default: none
    validators:
      - id: none_to_default_value
  hoofdlijnen:
    name: hoofdlijnen
    type: list_str
    column: hoofdlijnen
    validators:
      - id: none_to_default_value
  themas:
    name: themas
    type: list_str
    column: themas
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true
  portfolio_holder_1_id:
    name: portfolio_holder_1_id
    type: uuid
    column: portfolio_holder_1_id
    optional: true
  portfolio_holder_2_id:
    name: portfolio_holder_2_id
    type: uuid
    column: portfolio_holder_1_id
    optional: true
  client_1_id:
    name: client_1_id
    type: uuid
    column: client_1_id
    optional: true

models:
  maatregel_minimal:
    name: MaatregelMinimal
    fields:
      object_type:
      object_id:
      id:
      title:
  maatregel_basic:
    name: MaatregelBasic
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
    services:
      next_object_version:
        to_field: next_version
  maatregel_extended:
    name: MaatregelExtended
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
      hierarchy_code:
      werkingsgebied_code:
      gebiedengroep_code:
      themas:
      hoofdlijnen:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  maatregel_full:
    name: MaatregelFull
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      start_validity:
      end_validity:
      title:
      description:
      documents:
      role:
      roles:
      effect:
      hierarchy_code:
      werkingsgebied_code:
      gebiedengroep_code:
      themas:
      hoofdlijnen:
    dependency_model_ids:
      - user_short
      - hierarchy_statics
      - beleidskeuze_minimal
      - gebiedsprogramma_minimal
      - werkingsgebied_basic
      - werkingsgebied_statics
    services:
      next_object_version:
        to_field: next_version
      public_revisions:
        to_field: public_revisions
      join_werkingsgebieden:
        model_id: werkingsgebied_basic
        to_field: werkingsgebied
        from_field: werkingsgebied_code
      join_documents:
        to_field: documents_statics
        from_field: documents
      join_gebiedengroepen:
        to_field: gebiedengroep_static
        from_field: gebiedengroep_code
      join_gebiedsaanwijzingen:
        to_field: gebiedsaanwijzingen_statics
        from_fields:
          - description
          - effect
      join_hoofdlijnen:
        to_field: hoofdlijnen_statics
        from_fields:
          - hoofdlijnen
      insert_assets:
        fields:
          - description
          - effect
      relations:
        objects:
          - object_type: beleidskeuze
            object_id: beleidskeuze
            to_field: "Beleidskeuzes"
            model_id: beleidskeuze_minimal
            wrapped_with_relation_data: true
          - object_type: gebiedsprogramma
            object_id: gebiedsprogramma
            to_field: "Gebiedsprogrammas"
            model_id: gebiedsprogramma_minimal
            wrapped_with_relation_data: true
      foreign_keys_extender:
        fields_map:
          - to_field: hierarchy_statics
            model_id: hierarchy_statics
          - to_field: werkingsgebied_statics
            model_id: werkingsgebied_statics
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  maatregel_patch:
    name: MaatregelPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        default: none
        optional: true
        validators:
          - id: html
          - id: gebiedsaanwijzing_in_text
            data:
              allowed_code_types:
                - gebiedsaanwijzing
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
      roles:
        default: none
        optional: true
        validators:
          - id: allowed_values_list
            data: *roles_allowed_values_list_data
      effect:
        default: none
        optional: true
        validators:
          - id: html
          - id: gebiedsaanwijzing_in_text
            data:
              allowed_code_types:
                - gebiedsaanwijzing
          - id: image
            data:
              max_width: 1500
              max_height: 2500
              max_kb: 800
      hierarchy_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - beleidskeuze
          - id: object_code_exists
      documents:
        default: none
        optional: true
        validators:
          - id: object_codes_allowed_type
            data:
              allowed_object_types:
                - document
          - id: object_codes_exists
      werkingsgebied_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - werkingsgebied
          - id: object_code_exists
      gebiedengroep_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - gebiedengroep
          - id: object_code_exists
      themas:
        optional: true
      hoofdlijnen:
        optional: true
    services:
      extract_assets:
        fields:
          - description
          - effect
  maatregel_static:
    name: MaatregelStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
          - to_field: portfolio_holder_1
            model_id: user_short
          - to_field: portfolio_holder_2
            model_id: user_short
          - to_field: client_1
            model_id: user_short
  maatregel_static_post:
    name: MaatregelStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
      portfolio_holder_1_id:
      portfolio_holder_2_id:
      client_1_id:
  maatregel_static_post_validated:
    name: MaatregelStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
      - id: not_equal_root
        data:
          fields:
            - portfolio_holder_1_id
            - portfolio_holder_2_id
          allow_none: True
          error_message: Portfolio Holders should vary
    fields:
      owner_1_id:
      owner_2_id:
      portfolio_holder_1_id:
      portfolio_holder_2_id:
      client_1_id:
  maatregel_id:
    name: MaatregelID
    fields:
      object_id:
      id:
  maatregel_module_validate:
    name: MaatregelModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        validators:
          - id: length
            data:
              min: 3
          - id: html
      roles:
        validators:
          - id: allowed_values_list
            data: *roles_allowed_values_list_data
      effect:
        optional: true
        validators:
          - id: none_to_default_value
          - id: length
            data:
              min: 3
          - id: html
      hierarchy_code:
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - beleidskeuze
          - id: object_code_exists
      documents:
        default: none
        optional: true
        validators:
          - id: object_codes_allowed_type
            data:
              allowed_object_types:
                - document
          - id: object_codes_exists
      werkingsgebied_code:
        default: none
        optional: true
        validators:
          - id: object_code_allowed_type
            data:
              allowed_object_types:
                - werkingsgebied
          - id: object_code_exists
