id: werkingsgebied
object_type: werkingsgebied

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /werkingsgebieden
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: werkingsgebied_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: werkingsgebied_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: werkingsgebied_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: werkingsgebied_full
    - prefix: /werkingsgebied/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: werkingsgebied_static
        - resolver: edit_object_static
          resolver_data:
            request_model: werkingsgebied_static_post
            result_model: werkingsgebied_static_post_validated
    - prefix: /modules/{module_id}/object/werkingsgebied
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: werkingsgebied_patch
            response_model: werkingsgebied_id
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: werkingsgebied_extended
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: werkingsgebied_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: werkingsgebied_full
    - prefix: /modules/object/werkingsgebied
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/werkingsgebied/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: werkingsgebied_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
    validators:
      - id: none_to_default_value
  description:
    name: description
    type: str
    column: description
    validators:
      - id: none_to_default_value
  area_id:
    name: area_id
    type: uuid
    column: area_id
    optional: true
  idms_link:
    name: idms_link
    type: str
    column: idms_link
    validators:
      - id: none_to_default_value
  decision_number:
    name: decision_number
    type: str
    column: decision_number
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true

models:
  werkingsgebied_minimal:
    name: WerkingsgebiedMinimal
    fields:
      object_type:
      object_id:
      id:
      title:
  werkingsgebied_basic:
    name: WerkingsgebiedBasic
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      area_id:
      start_validity:
      end_validity:
  werkingsgebied_extended:
    name: WerkingsgebiedExtended
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      area_id:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  werkingsgebied_full:
    name: WerkingsgebiedFull
    fields:
      object_id:
      code:
      id:
      adjust_on:
      created_date:
      modified_date:
      title:
      description:
      start_validity:
      end_validity:
      area_id:
    dependency_model_ids:
      - user_short
      - area_basic
    services:
      werkingsgebied_related_objects:
        to_field: related_objects
      foreign_keys_extender:
        fields_map:
          - to_field: area
            model_id: area_basic
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  werkingsgebied_patch:
    name: WerkingsgebiedPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      description:
        default: none
        optional: true
      area_id:
    services:
      change_area:
        fields:
          - area_id
  werkingsgebied_static:
    name: WerkingsgebiedStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  werkingsgebied_static_post:
    name: WerkingsgebiedStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
  werkingsgebied_static_post_validated:
    name: WerkingsgebiedStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
    fields:
      owner_1_id:
      owner_2_id:
  werkingsgebied_id:
    name: WerkingsgebiedUUID
    fields:
      object_id:
      id:
  werkingsgebied_module_validate:
    name: WerkingsgebiedModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      area_id:
  