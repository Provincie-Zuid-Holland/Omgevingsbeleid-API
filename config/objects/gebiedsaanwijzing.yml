id: gebiedsaanwijzing
object_type: gebiedsaanwijzing

sort_allowed_columns: &sort_allowed_columns
  - object_id
  - title
  - modified_date

sort_default_title: &sort_default_title
  default:
    column: title
    order: asc
  allowed_columns: *sort_allowed_columns

sort_default_modified_date: &sort_default_modified_date
  default:
    column: modified_date
    order: desc
  allowed_columns: *sort_allowed_columns

api:
  routers:
    - prefix: /gebiedsaanwijzingen
      endpoints:
        - resolver: valid_list_lineages
          resolver_data:
            path: /valid
            response_model: gebiedsaanwijzing_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_title
        - resolver: valid_list_lineage_tree
          resolver_data:
            path: /valid/{lineage_id}
            response_model: gebiedsaanwijzing_basic
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedsaanwijzing_full
        - resolver: object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedsaanwijzing_full
    - prefix: /gebiedsaanwijzing/static/{lineage_id}
      endpoints:
        - resolver: get_object_static
          resolver_data:
            response_model: gebiedsaanwijzing_static
        - resolver: edit_object_static
          resolver_data:
            request_model: gebiedsaanwijzing_static_post
            result_model: gebiedsaanwijzing_static_post_validated
    - prefix: /modules/{module_id}/object/gebiedsaanwijzing
      endpoints:
        - resolver: module_patch_object
          resolver_data:
            path: /{lineage_id}
            request_model: gebiedsaanwijzing_patch
            response_model: gebiedsaanwijzing_id
        - resolver: module_list_lineage_tree
          resolver_data:
            path: /{lineage_id}
            response_model: gebiedsaanwijzing_extended
            allowed_filter_columns:
              - title
            sort: *sort_default_modified_date
        - resolver: module_object_latest
          resolver_data:
            path: /latest/{lineage_id}
            response_model: gebiedsaanwijzing_full
        - resolver: module_object_version
          resolver_data:
            path: /version/{object_uuid}
            response_model: gebiedsaanwijzing_full
    - prefix: /modules/object/gebiedsaanwijzing
      endpoints:
        - resolver: list_active_module_objects
          resolver_data:
            path: /active/{lineage_id}
    - prefix: /revisions/{module_id}/gebiedsaanwijzing/version/{object_uuid}
      endpoints:
        - resolver: module_object_version
          resolver_data:
            response_model: gebiedsaanwijzing_full
            minimum_status: 'Ontwerp GS Concept'
            require_auth: False

fields:
  title:
    name: title
    type: str
    column: title
  ref_type:
    name: ref_type
    type: str
    column: ref_type
    validators:
      - id: none_to_default_value
  ref_group:
    name: ref_group
    type: str
    column: ref_group
    validators:
      - id: none_to_default_value
  target_codes:
    name: target_codes
    type: list_str
    column: target_codes
    validators:
      - id: none_to_default_value

  # Statics
  owner_1_id:
    name: owner_1_id
    type: uuid
    column: owner_1_id
    optional: true
  owner_2_id:
    name: owner_2_id
    type: uuid
    column: owner_2_id
    optional: true

models:
  gebiedsaanwijzing_minimal:
    name: GebiedsaanwijzingMinimal
    fields:
      object_type:
      object_id:
      uuid:
      title:
  gebiedsaanwijzing_basic:
    name: GebiedsaanwijzingBasic
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      start_validity:
      end_validity:
  gebiedsaanwijzing_extended:
    name: GebiedsaanwijzingExtended
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      ref_type:
      ref_group:
      target_codes:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedsaanwijzing_full:
    name: GebiedsaanwijzingFull
    fields:
      object_id:
      code:
      uuid:
      adjust_on:
      created_date:
      modified_date:
      title:
      ref_type:
      ref_group:
      target_codes:
      start_validity:
      end_validity:
    dependency_model_ids:
      - user_short
    services:
      join_objects:
        to_field: geo_statics
        from_field: target_codes
      foreign_keys_extender:
        fields_map:
          - to_field: created_by
            model_id: user_short
          - to_field: modified_by
            model_id: user_short
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedsaanwijzing_patch:
    name: GebiedsaanwijzingPatch
    fields:
      title:
        default: none
        optional: true
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      target_codes:
        optional: false
        validators:
          - id: not_empty
          - id: object_codes_allowed_type
            data:
              allowed_object_types:
                - gebied
                - gebiedengroep
          - id: object_codes_valid_for_module
      ref_type:
      ref_group:
  gebiedsaanwijzing_static:
    name: GebiedsaanwijzingStatic
    static_only: true
    fields: {}
    dependency_model_ids:
      - user_short
    services:
      static_foreign_keys_extender:
        fields_map:
          - to_field: owner_1
            model_id: user_short
          - to_field: owner_2
            model_id: user_short
  gebiedsaanwijzing_static_post:
    name: GebiedsaanwijzingStaticPost
    static_only: true
    fields:
      owner_1_id:
      owner_2_id:
  gebiedsaanwijzing_static_post_validated:
    name: GebiedsaanwijzingStaticPostValidated
    static_only: true
    model_validators:
      - id: not_equal_root
        data:
          fields:
            - owner_1_id
            - owner_2_id
          allow_none: True
          error_message: Owners should vary
    fields:
      owner_1_id:
      owner_2_id:
  gebiedsaanwijzing_id:
    name: GebiedsaanwijzingUUID
    fields:
      object_id:
      uuid:
  gebiedsaanwijzing_module_validate:
    name: GebiedsaanwijzingModuleValidate
    fields:
      title:
        validators:
          - id: length
            data:
              min: 3
              max: 200
          - id: plain_text
      target_codes:
        optional: false
        validators:
          - id: object_codes_allowed_type
            data:
              allowed_object_types:
                - gebied
                - gebiedengroep
          - id: object_codes_exists
          - id: not_empty
      ref_type:
      ref_group:
