name: Check Alembic has a single head

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_PYTHON_PREFERENCE: only-managed
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OMGEVINGSBELEID: "0.0.0"
  UV_NO_SYNC: "1"

jobs:
  alembic-heads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Check Alembic heads
        run: |
          set -euo pipefail
          HEADS="$(uv run alembic heads)"
          echo "$HEADS"
          COUNT="$(grep -c '(head)' <<< "$HEADS" || true)"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Alembic has $COUNT heads, expected 1. Rebase on main and set your migration's down_revision to the current head."
            exit 1
          fi
