name: Check code lint and format via Ruff

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_PYTHON_PREFERENCE: only-managed
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_OMGEVINGSBELEID: "0.0.0"
  UV_NO_SYNC: "1"

jobs:
  ruff:
    runs-on: ubuntu-latest
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Ruff
        run: uv sync --locked --only-dev

      - name: Ruff check
        run: make check
